---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: personal-os
# description will be included in the image's metadata
description: This is my personal OS image.

# the base image to build on top of (FROM) and the version tag to use
base-image: ghcr.io/ublue-os/silverblue-main
image-version: 42 # latest is also supported if you want new updates ASAP

# module configuration, executed in order
# you can include multiple instances of the same module
modules:
  - type: files
    files:
      - source: system
        destination: / # copies files/system/* (* means everything inside it) into your image's root folder /

  - type: dnf
    repos:
      copr:
        - atim/starship
    install:
      packages:
        - micro
        - starship
        - code
        - tableplus
        - gnome-tweaks
    remove:
      packages:
        # example: removing firefox (in favor of the flatpak)
        # "firefox" is the main package, "firefox-langpacks" is a dependency
        - firefox
        - firefox-langpacks # also remove firefox dependency (not required for all packages, this is a special case)

  - type: default-flatpaks
    configurations:
      - notify: true # Send notification after install/uninstall is finished (true/false)
        scope: system
        # If no repo information is specified, Flathub will be used by default
        install: # system flatpaks we want all users to have and not remove
          - org.mozilla.firefox
          - org.gnome.Loupe
          - com.github.tchx84.Flatseal
          - com.obsproject.Studio
          - org.telegram.desktop
          - org.onlyoffice.desktopeditors
          - org.gimp.GIMP
          - org.gnome.Extensions
          - org.gtk.Gtk3theme.Orchis-Dark
      - scope: user # Also add Flathub user repo, but no user packages
      
  - type: systemd
    system:
      enabled:
        - bluetooth.service

  - type: gnome-extensions
    install:
      - 2236
      - 3193
      - 615
      - 307
     # - Tray Icons
      - 19
      - 3628
      - 1460
     # - OpenWeather
     # - Sound Input & Output Device Chooser
      - 7
      - 779

  - type: gschema-overrides
    include:
      - zz1-custom_config.gschema.override

  - type: script
    snippets:
      - mkdir -p /etc/gtk-4.0
      - ln -sf /usr/share/themes/Orchis-Dark/gtk-4.0/assets /etc/gtk-4.0/assets
      - ln -sf /usr/share/themes/Orchis-Dark/gtk-4.0/gtk.css /etc/gtk-4.0/gtk.css
      - ln -sf /usr/share/themes/Orchis-Dark/gtk-4.0/gtk-dark.css /etc/gtk-4.0/gtk-dark.css
      # Condividiamo la cartella dei temi di sistema con il sandbox Flatpak
      - flatpak override --system --filesystem=/usr/share/themes:ro
      
      # Diciamo a Flatpak che la cartella dei temi si trova lì
      - flatpak override --system --env=GTK_PATH=/usr/share/themes
      
      # Forziamo il nome del tema GTK
      - flatpak override --system --env=GTK_THEME=Orchis-Dark
      
  - type: signing # this sets up the proper policy & signing files for signed images to work fully
